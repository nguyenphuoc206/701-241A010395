<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đồng hồ đếm ngược</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #38bdf8;
      --danger: #f43f5e;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .timer-card {
      background: var(--card);
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      max-width: 380px;
      width: 100%;
    }

    .timer-card h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    .time-display {
      font-size: 4.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 4px;
      color: var(--primary);
      margin-bottom: 32px;
      transition: color 0.3s ease;
    }

    /* Animation khi dưới 1 phút */
    .time-display.warning {
      color: var(--danger);
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%   { transform: scale(1); opacity: 1; }
      50%  { transform: scale(1.06); opacity: 0.85; }
      100% { transform: scale(1); opacity: 1; }
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-start {
      background: var(--primary);
      color: #0f172a;
    }

    .btn-start:hover {
      opacity: 0.9;
    }

    .btn-reset {
      background: transparent;
      color: var(--muted);
      border: 1px solid #334155;
    }

    .btn-reset:hover {
      background: #334155;
      color: var(--text);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
      z-index: 100;
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--card);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      max-width: 320px;
      width: 90%;
      transform: scale(0.9);
      transition: transform 0.3s;
    }

    .modal-overlay.show .modal {
      transform: scale(1);
    }

    .modal-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .modal h2 {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }

    .modal p {
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .modal .btn {
      background: var(--danger);
      color: white;
      width: 100%;
    }

    @media (max-width: 400px) {
      .time-display {
        font-size: 3.5rem;
      }

      .timer-card {
        padding: 32px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="timer-card">
    <h1>Đồng hồ đếm ngược</h1>
    <div class="time-display" id="timeDisplay">10:00</div>
    <div class="controls">
      <button class="btn btn-start" id="startBtn">Bắt đầu</button>
      <button class="btn btn-reset" id="resetBtn">Đặt lại</button>
    </div>
  </div>

  <!-- Modal hết giờ -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-icon">⏰</div>
      <h2>Hết thời gian!</h2>
      <p>Đồng hồ đếm ngược đã kết thúc.</p>
      <button class="btn" id="closeModalBtn">Đóng</button>
    </div>
  </div>

  <script>
    // Thời gian ban đầu: 10 phút = 600 giây
    const INITIAL_SECONDS = 10 * 60;
    let remainingSeconds = INITIAL_SECONDS;
    let timerId = null;
    let isRunning = false;

    const timeDisplay = document.getElementById("timeDisplay");
    const startBtn = document.getElementById("startBtn");
    const resetBtn = document.getElementById("resetBtn");
    const modal = document.getElementById("modal");
    const closeModalBtn = document.getElementById("closeModalBtn");

    // Định dạng số thành 2 chữ số (01, 02...)
    function pad(num) {
      return String(num).padStart(2, "0");
    }

    // Cập nhật giao diện
    function updateDisplay() {
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      timeDisplay.textContent = `${pad(minutes)}:${pad(seconds)}`;

      // Thêm animation khi dưới 1 phút
      if (remainingSeconds > 0 && remainingSeconds < 60) {
        timeDisplay.classList.add("warning");
      } else {
        timeDisplay.classList.remove("warning");
      }
    }

    // Hàm đếm ngược mỗi giây
    function tick() {
      if (remainingSeconds <= 0) {
        clearInterval(timerId);
        timerId = null;
        isRunning = false;
        startBtn.textContent = "Bắt đầu";
        timeDisplay.classList.remove("warning");
        showModal();
        return;
      }

      remainingSeconds--;
      updateDisplay();
    }

    // Bắt đầu / Tạm dừng
    function toggleTimer() {
      if (isRunning) {
        // Tạm dừng
        clearInterval(timerId);
        timerId = null;
        isRunning = false;
        startBtn.textContent = "Tiếp tục";
      } else {
        // Bắt đầu hoặc tiếp tục
        if (remainingSeconds <= 0) {
          remainingSeconds = INITIAL_SECONDS;
          updateDisplay();
        }
        timerId = setInterval(tick, 1000);
        isRunning = true;
        startBtn.textContent = "Tạm dừng";
      }
    }

    // Đặt lại
    function resetTimer() {
      clearInterval(timerId);
      timerId = null;
      isRunning = false;
      remainingSeconds = INITIAL_SECONDS;
      updateDisplay();
      startBtn.textContent = "Bắt đầu";
      timeDisplay.classList.remove("warning");
    }

    // Hiện modal
    function showModal() {
      modal.classList.add("show");
    }

    // Ẩn modal
    function hideModal() {
      modal.classList.remove("show");
    }

    // Gán sự kiện
    startBtn.addEventListener("click", toggleTimer);
    resetBtn.addEventListener("click", resetTimer);
    closeModalBtn.addEventListener("click", hideModal);

    // Đóng modal khi click ra ngoài
    modal.addEventListener("click", function (e) {
      if (e.target === modal) {
        hideModal();
      }
    });

    // Hiển thị ban đầu
    updateDisplay();
  </script>
</body>
</html>
