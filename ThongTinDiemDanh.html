<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài liệu Google Drive – Nguyễn Văn Phước</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --blue: #3b82f6;
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image: 
        linear-gradient(rgba(15, 23, 42, 0.97), rgba(15, 23, 42, 0.97)),
        linear-gradient(#1e293b 1px, transparent 1px),
        linear-gradient(90deg, #1e293b 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 28px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }

    .icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .name {
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 12px;
    }

    p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .btn-drive {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--blue);
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-drive:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }

    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover { text-decoration: underline; }

    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="icon">📁</div>
      <h1>Tài liệu Google Drive</h1>
      <div class="name">Nguyễn Văn Phước</div>
      <p>Nhấn nút bên dưới để mở file trên Google Drive</p>

      <a 
        href="https://drive.google.com/file/d/1zo2KZ1YTxfqaCiZ4ei9iVVZhyFhND8Xa/view" 
        target="_blank" 
        rel="noopener noreferrer"
        class="btn-drive"
      >
        📂 Mở Google Drive
      </a>
    </div>

    <a href="baitap22.html" class="back-link">← Quay lại kết quả bài thi</a>
  </div>

  <footer>Nguyễn Văn Phước</footer>
</body>
</html>
